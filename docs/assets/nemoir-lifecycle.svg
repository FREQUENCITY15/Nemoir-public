<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title description">
  <title id="title">The Nemoir tendril lifecycle</title>
  <desc id="description">A conversation deposit moves through recipient claim, semantic exclusion, tendril recovery, human review, and later return.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063c4b"/>
      <stop offset="1" stop-color="#086b78"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff45b5"/>
      <stop offset="1" stop-color="#8f3cff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001e2b" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31e4e8"/>
    </marker>
  </defs>

  <rect width="1400" height="440" rx="28" fill="url(#ocean)"/>
  <path d="M75 406 C180 317 238 449 350 360 S540 430 650 350 S852 424 970 347 S1167 428 1328 322" fill="none" stroke="#ff45b5" stroke-width="15" stroke-linecap="round" opacity="0.27"/>
  <path d="M87 431 C213 358 266 449 397 383 S613 453 746 374 S976 456 1111 375 S1263 411 1364 348" fill="none" stroke="#963cff" stroke-width="18" stroke-linecap="round" opacity="0.3"/>

  <text x="700" y="55" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">The Nemoir tendril lifecycle</text>
  <text x="700" y="87" fill="#bff9fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">Human choice defines the boundary; provenance keeps every recovered branch inspectable.</text>

  <g stroke="#31e4e8" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path d="M247 211 H282"/>
    <path d="M457 211 H492"/>
    <path d="M667 211 H702"/>
    <path d="M877 211 H912"/>
    <path d="M1087 211 H1122"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(57 135)">
      <rect width="190" height="152" rx="22" fill="#ffffff"/>
      <circle cx="28" cy="28" r="18" fill="#12cfd5"/>
      <text x="28" y="34" fill="#063c4b" font-size="17" font-weight="800" text-anchor="middle">1</text>
      <text x="95" y="73" fill="#0b274b" font-size="21" font-weight="750" text-anchor="middle">Deposit</text>
      <text x="95" y="102" fill="#496174" font-size="15" text-anchor="middle">Conversation bundle</text>
      <text x="95" y="124" fill="#496174" font-size="15" text-anchor="middle">preserved intact</text>
    </g>
    <g transform="translate(267 135)">
      <rect width="190" height="152" rx="22" fill="#ffffff"/>
      <circle cx="28" cy="28" r="18" fill="#ff45b5"/>
      <text x="28" y="34" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">2</text>
      <text x="95" y="73" fill="#0b274b" font-size="21" font-weight="750" text-anchor="middle">Recipient claim</text>
      <text x="95" y="102" fill="#496174" font-size="15" text-anchor="middle">A human chooses</text>
      <text x="95" y="124" fill="#496174" font-size="15" text-anchor="middle">what to take up</text>
    </g>
    <g transform="translate(477 135)">
      <rect width="190" height="152" rx="22" fill="#ffffff"/>
      <circle cx="28" cy="28" r="18" fill="#963cff"/>
      <text x="28" y="34" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">3</text>
      <text x="95" y="68" fill="#0b274b" font-size="19" font-weight="750" text-anchor="middle">Semantic</text>
      <text x="95" y="91" fill="#0b274b" font-size="19" font-weight="750" text-anchor="middle">exclusion</text>
      <text x="95" y="122" fill="#496174" font-size="15" text-anchor="middle">Subtract claimed meaning</text>
    </g>
    <g transform="translate(687 135)">
      <rect width="190" height="152" rx="22" fill="#ffffff"/>
      <circle cx="28" cy="28" r="18" fill="url(#coral)"/>
      <text x="28" y="34" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">4</text>
      <text x="95" y="68" fill="#0b274b" font-size="19" font-weight="750" text-anchor="middle">Tendril</text>
      <text x="95" y="91" fill="#0b274b" font-size="19" font-weight="750" text-anchor="middle">recovery</text>
      <text x="95" y="122" fill="#496174" font-size="15" text-anchor="middle">Preserve unfinished edges</text>
    </g>
    <g transform="translate(897 135)">
      <rect width="190" height="152" rx="22" fill="#ffffff"/>
      <circle cx="28" cy="28" r="18" fill="#ff45b5"/>
      <text x="28" y="34" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">5</text>
      <text x="95" y="73" fill="#0b274b" font-size="21" font-weight="750" text-anchor="middle">Human review</text>
      <text x="95" y="102" fill="#496174" font-size="15" text-anchor="middle">Inspect evidence</text>
      <text x="95" y="124" fill="#496174" font-size="15" text-anchor="middle">and decide</text>
    </g>
    <g transform="translate(1107 135)">
      <rect width="190" height="152" rx="22" fill="#ffffff"/>
      <circle cx="28" cy="28" r="18" fill="#12cfd5"/>
      <text x="28" y="34" fill="#063c4b" font-size="17" font-weight="800" text-anchor="middle">6</text>
      <text x="95" y="68" fill="#0b274b" font-size="19" font-weight="750" text-anchor="middle">Later return</text>
      <text x="95" y="91" fill="#0b274b" font-size="19" font-weight="750" text-anchor="middle">or resurfacing</text>
      <text x="95" y="122" fill="#496174" font-size="15" text-anchor="middle">Re-enter attention</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="456" y="322" width="488" height="52" rx="26" fill="#062f46" stroke="#31e4e8" stroke-width="2"/>
    <text x="700" y="354" fill="#eaffff" font-size="16">Every Tendril retains source evidence, provenance, and lifecycle history.</text>
  </g>
</svg>
